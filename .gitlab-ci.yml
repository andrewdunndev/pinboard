# pinboard CI: validate the pipeline.py script parses + requirements
# resolve. The full render pipeline is compute-heavy (~15 min) and
# runs locally; CI just gates against syntax breaks.

stages:
  - lint


lint:
  stage: lint
  image: python:3.14-slim@sha256:0741d101873c12ab927e6f8653feb8862b9bd58771177acb1b885b95141f91b4
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python -m py_compile pipeline.py
