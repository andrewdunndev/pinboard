# pinboard CI: validate the pipeline.py script parses + requirements
# resolve. The full render pipeline is compute-heavy (~15 min) and
# runs locally; CI just gates against syntax breaks.

stages:
  - lint
  - release

include:
  - component: gitlab.com/dunn.dev/pipeline/github-release@4.17.0
    inputs:
      github_repo: andrewdunndev/pinboard


lint:
  stage: lint
  image: python:3.15-slim@sha256:08a4c22c92b79ec821a7ad49768480039ee5b7accac3955228e75366e30abc8e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python -m py_compile pipeline.py
