# pinboard CI: validate the pipeline.py script parses + requirements
# resolve. The full render pipeline is compute-heavy (~15 min) and
# runs locally; CI just gates against syntax breaks.

stages:
  - lint
  - release

include:
  - component: gitlab.com/dunn.dev/pipeline/github-release@4.14.0
    inputs:
      github_repo: andrewdunndev/pinboard


lint:
  stage: lint
  image: python:3.15-slim@sha256:e97b88e416c3c01eb427b21fd8cd3ebf006e6ee38afcfcc3cae1c54ee2ab0a75
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python -m py_compile pipeline.py
