# .deviations.yaml — declared exceptions to the dunn.dev reference
# standards. Format per reference.dunn.dev/deviations/.

- standard: design-system
  assertion: grep:global.css
  reason: |
    pinboard has no HTML surface. The deliverable is a 4K video
    composited from photos via Python + ffmpeg. No global.css to
    declare token imports in.
  expires: 2099-01-01
  owner: andrew@dunn.dev

- standard: design-system
  assertion: grep:package.json
  reason: |
    Same root cause as the global.css deviation above. pinboard is
    a Python project (pyproject.toml), not an Astro consumer.
  expires: 2099-01-01
  owner: andrew@dunn.dev

- standard: pipeline
  assertion: file-exists:.gitlab-ci.yml
  reason: |
    pinboard has no CI — iteration is local on the operator's
    machine, building a 4K video from a personal photo set. The
    output is not something shared CI should be building.
  expires: 2099-01-01
  owner: andrew@dunn.dev

- standard: pipeline
  assertion: file-contains:.gitlab-ci.yml
  reason: |
    Same root cause as the file-exists deviation above. There is
    no .gitlab-ci.yml to inspect.
  expires: 2099-01-01
  owner: andrew@dunn.dev
