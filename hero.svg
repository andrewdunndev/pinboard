<svg viewBox="0 0 1200 430" width="1200" height="430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="pinboard hero: Ken Burns-style 4K video generator. Polaroids on a panoramic backdrop with smooth motion and music.">
  <rect x="0" y="0" width="1200" height="430" fill="#f4f4f4"/>
  <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">

  <text x="60" y="34" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">PINBOARD · PHOTOS → 4K VIDEO · KEN BURNS WITH MUSIC</text>
  <text x="1140" y="34" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">2026</text>
  <line x1="60" y1="48" x2="1140" y2="48" stroke="#e0e0e0" stroke-width="1"/>

  <text x="60" y="138" font-size="72" font-weight="700" fill="#4a6741" letter-spacing="-2">pinboard</text>
  <text x="60" y="172" font-size="14" fill="#404040">photos composited as vintage polaroids on a panoramic backdrop,</text>
  <text x="60" y="192" font-size="14" fill="#404040">with smooth Ken Burns motion and synchronized music.</text>
  <text x="60" y="222" font-size="12" font-style="italic" fill="#404040">drop photos in, get 4K video out.</text>

  <g transform="translate(110 240) scale(2.2)" stroke="#4a6741" fill="none" stroke-linecap="round">
    <rect x="6"  y="14" width="52" height="36" stroke-width="1.4" rx="1.5"/>
    <rect x="20" y="20" width="20" height="22" stroke-width="1.6" rx="1" transform="rotate(-6 30 31)"/>
    <rect x="28" y="22" width="20" height="22" stroke-width="1.6" rx="1" transform="rotate(5 38 33)"/>
  </g>
  <circle cx="176" cy="284" r="3" fill="#4a6741"/>
  <circle cx="198" cy="288" r="3" fill="#4a6741"/>

  <text x="560" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">FLOW</text>
  <text x="850" y="72" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">DISCIPLINE</text>

  <rect x="560" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">IN</text>
  <text x="578" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">photos</text>
  <text x="578" y="178" font-size="11" fill="#404040">a folder of JPEGs + a panoramic + a soundtrack</text>
  <text x="578" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">INPUT/ · DROP IN, RUN MAKE</text>

  <rect x="850" y="84" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="106" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">POSTURE</text>
  <text x="868" y="152" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">local</text>
  <text x="868" y="178" font-size="11" fill="#404040">no upload, no service, no shared identifier</text>
  <text x="868" y="200" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">SINGLE OPERATOR · ON DISK</text>

  <rect x="560" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="578" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">OUT</text>
  <text x="578" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">4K video</text>
  <text x="578" y="318" font-size="11" fill="#404040">polaroids panning over the backdrop with music</text>
  <text x="578" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">H.264 · 3840×2160 · 60FPS</text>

  <rect x="850" y="224" width="270" height="130" rx="3" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="868" y="246" font-size="10" font-weight="700" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">LIFETIME</text>
  <text x="868" y="292" font-size="32" font-weight="700" fill="#4a6741" letter-spacing="-0.5">reproducible</text>
  <text x="868" y="318" font-size="11" fill="#404040">same inputs, same seed, same video</text>
  <text x="868" y="340" font-size="9" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="0.6">DETERMINISTIC · FFMPEG PINNED</text>

  <line x1="60" y1="386" x2="1140" y2="386" stroke="#e0e0e0" stroke-width="1"/>
  <text x="60" y="412" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">PYTHON · FFMPEG · IMAGEMAGICK · 4K</text>
  <text x="1140" y="412" text-anchor="end" font-size="10" font-weight="600" font-family="IBM Plex Mono, Menlo, monospace" fill="#707070" letter-spacing="1.4">PRIVATE · GITLAB.COM/DUNN.DEV/PINBOARD</text>
  </g>
</svg>
